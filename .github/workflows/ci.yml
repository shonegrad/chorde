name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Type check (web)
        working-directory: packages/web
        run: npx tsc --noEmit

      - name: Type check (api)
        working-directory: packages/api
        run: npx tsc --noEmit

      - name: Test (web)
        working-directory: packages/web
        run: npm test -- --run

      - name: Test (api)
        working-directory: packages/api
        run: npm test -- --run

      - name: Build (web)
        working-directory: packages/web
        run: npm run build

      - name: Build (api)
        working-directory: packages/api
        run: npm run build