    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181B" />
    <meta name="description" content="Chorde — a local-first ChordPro songbook." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Chorde — Songbook</title>
    <style>
      /* Boot splash, shown until the app has loaded its library. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #18181b;
        color: #e4e4e7;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        z-index: 9999;
      }
      #boot-splash .mark {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #boot-splash .bar {
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: #27272a;
        overflow: hidden;
      }
      #boot-splash .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #eab308;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="mark">Chorde</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
  </body>
